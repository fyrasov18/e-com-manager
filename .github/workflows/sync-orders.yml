name: Sync Orders

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  sync-orders:
    runs-on: ubuntu-latest

    steps:
      - name: Call sync endpoint
        run: |
          curl --fail-with-body -X POST "${{ secrets.SYNC_URL }}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
